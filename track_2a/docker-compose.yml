services:
  backend:
    build: .
    ports:
      - "8000:8000"
    # Values come from the shell or from .env next to this file (both optional,
    # so `make run` also starts on a fresh clone; /chat then returns 503).
    environment:
      LLM_NAME: ${LLM_NAME:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the backend, so this is a host URL, not a service name.
        # VITE_USE_MOCK=true until the backend implements docs/api.md.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
    ports:
      - "8080:80"
